[package]
name = "s3d-app"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
description = "Simply3D desktop app"

[[bin]]
name = "simply3d"
path = "src/main.rs"

[dependencies]
s3d-core = { path = "../s3d-core" }
bytemuck = { version = "1.25", features = ["derive"] }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "persistence", "x11", "wayland"] }
egui = "0.36"
resvg = "0.45"
egui_extras = { version = "0.36", default-features = false, features = ["svg", "image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
egui-wgpu = "0.36"
env_logger = "0.11"
glam = { version = "0.34", features = ["bytemuck", "serde"] }
log = "0.4"
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
# update check against GitHub releases (system certificates, so it works behind company proxies)
ureq = { version = "2", default-features = false, features = ["tls", "native-certs", "json"] }
transform-gizmo-egui = "0.11"
epaint_default_fonts = "0.36"

# the program icon and version details in simply3d.exe
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
