[workspace]
resolver = "2"
members = ["crates/s3d-core", "crates/s3d-app"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/p3tr0s/Simply3D"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.s3d-core]
opt-level = 3
